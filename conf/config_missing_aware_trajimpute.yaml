# TrajGap-Bench 统一 Mixed 配置。
# Easy/Hard 只作为底层官方文件来源，训练、验证和测试均由 TrajGap 合并。
# 用法（单场景 Mixed smoke）：
#   PYTHONPATH=. python train.py --config-name=config_missing_aware_trajimpute \
#     scene=ETH-M difficulty=Mixed train_difficulties=[Mixed] val_difficulties=[Mixed] \
#     hydra.run.dir=outputs/trajgap_smoke/M0_ETH-M
defaults:
  - datamodule: trajimpute
  - model: missing_aware_ethucy_model_forecast
  - _self_

hydra:
  run:
    dir: outputs/${output}/${now:%Y%m%d-%H%M%S}

seed: 2024
scene: ETH-M
difficulty: Mixed
train_difficulties: [Mixed]
val_difficulties: [Mixed]
train_sampling_scheme: natural
train_sampling_seed: ${seed}
# checkpoint 选点：按方案 §2，最终输出分支的 b-minFDE20（对概率校准敏感）。
# M0 监控 val_new_b-minFDE20（raw final），M1 覆盖为 val_cal_b-minFDE20
# （calibrated final）——runner variant_monitor() 自动映射，此处为 M0 默认。
monitor: val_new_b-minFDE20
save_top_k: 1

data_root: /home/lbh/TrajImpute/dataset/TrajImpute
# TrajGap-Bench 正式主协议：所有训练、验证和测试均使用 Mixed。
# zero_missing_only 仅保留为底层数据诊断开关，不属于正式 benchmark。
zero_missing_only: false
checkpoint:
pretrained_weights:
output: trajgap_${model_version}_${scene}_${difficulty}${clean_suffix}
clean_suffix: ''

# trainer
num_workers: 4
gpus: 1
sync_bn: false
batch_size: 64
epochs: 100
warmup_epochs: 5
precision: bf16
# 主链 K=20 裁定（2026-09-12）：编码器固定原版单向（bimamba=false，旗标仅作用于
# encoder 的 4 层 hist_embed_mamba；decoder state Mamba 原版即硬编码双向，不受影响）。
# 后续实验无须再区分单双向；uni/bi 对照臂仅作为一次性验证保留在
# outputs/trajimpute_retrain_uni 与 outputs/clean_ethucy_uni。
bimamba: false

# optimizer
lr: 0.001
weight_decay: 0.0001
gradient_clip_val: 5
gradient_clip_algorithm: norm

limit_train_batches:
limit_val_batches:
limit_test_batches:
log_model: all
test: false

# 模型版本标签（仅用于 output 命名）：0/1/2 对应 M0/M1/M2
model_version: '0'

# M1：自然缺失证据条件化输出校准开关（方案 §6）。默认 false=M0 原路径；
# 训练 M1 时覆盖 calibration=true。raw/calibrated 两套输出始终并存。
calibration: false

# TrajImpute 原始评估脚本使用 best-of-20；该覆盖只作用于 direct 配置，
# 历史 ETH/UCY train_adapt 配置保持 K=6。
model:
  target:
    model:
      num_modes: 20
