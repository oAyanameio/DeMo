name: moflow_ethucy
phase: default

target:
  _target_: src.datamodule.moflow_ethucy_datamodule.MoFlowEthUcyDataModule

  data_root: '/home/lbh/MoFlow/data/eth_ucy/original'
  # Standard leave-one-out protocol (SocialGAN splits, same as MoFlow paper):
  # held-out subset = test; the other 4 scenes = train/val.
  # Cycle target.subset through: eth, hotel, univ, zara1, zara2 (5 folds), then average.
  subset: eth
  obs_len: 8
  pred_len: 12
  train_batch_size: ${batch_size}
  val_batch_size: ${batch_size}
  test_batch_size: ${batch_size}
  num_workers: ${num_workers}
  pin_memory: True
