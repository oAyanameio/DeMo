defaults:
  - datamodule: moflow_ethucy
  - model: moflow_ethucy_model_forecast

hydra:
  run:
    dir: outputs/${output}/${now:%Y%m%d-%H%M%S}

seed: 2024
monitor: val_minFDE20
save_top_k: 3

data_root:
checkpoint:
pretrained_weights:
output: moflow_${datamodule.target.subset}

# trainer
num_workers: 4
gpus: 1
sync_bn: false
batch_size: 64
epochs: 100
warmup_epochs: 5
precision: bf16

# optimizer
lr: 0.001
weight_decay: 0.0001
gradient_clip_val: 5
gradient_clip_algorithm: norm

limit_train_batches:
limit_val_batches:
limit_test_batches:
log_model: all
test: false
