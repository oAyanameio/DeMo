name: missing_aware_ethucy
phase: actor-only

target:
  _target_: src.model.trainer_forecast.Trainer
  model:
    type: 'ModelForecast'
    embed_dim: 128
    future_steps: 12
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: False
    drop_path: 0.2
    num_actor_types: 1
    num_modes: 6
    dt: 0.4
    obs_len: 8
    # M0_base 默认；M1_obs/M2_history 经 Hydra override 开启：
    use_observation_features: false
    use_missing_summary: false
    use_gap_condition: false
    use_motion_features: false   # B1（P0.5）经 override 开启
    use_evidence_clock: false   # M1'（P1）经 override 开启：State Query 时间自变量改为距最后有效观测
    # 主链裁定（2026-09-12）：编码器固定原版单向，与 trajimpute 主配置同步；无须区分单双向。
    bimamba: ${bimamba}
  pretrained_weights: ${pretrained_weights}
  lr: ${lr}
  weight_decay: ${weight_decay}
  epochs: ${epochs}
  warmup_epochs: ${warmup_epochs}
