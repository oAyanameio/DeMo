name: missing_aware_ethucy
phase: actor-only

target:
  _target_: src.model.trainer_forecast.Trainer
  model:
    type: 'ModelForecast'
    embed_dim: 128
    future_steps: 12
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: False
    drop_path: 0.2
    num_actor_types: 1
    num_modes: 6
    bimamba: true
    dt: 0.4
    obs_len: 8
    # M0_base 默认；M1_obs/M2_history 经 Hydra override 开启：
    #   M1: model.target.model.use_observation_features=true
    #   M2: 再加 model.target.model.use_missing_summary=true
    # M3/M4（condition_state_query/mode_query/hybrid）未实现，禁止添加。
    use_observation_features: false
    use_missing_summary: false
    use_gap_condition: false
  pretrained_weights: ${pretrained_weights}
  lr: ${lr}
  weight_decay: ${weight_decay}
  epochs: ${epochs}
  warmup_epochs: ${warmup_epochs}
