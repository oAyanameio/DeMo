name: missing_aware_ethucy
phase: actor-only

target:
  _target_: src.model.trainer_forecast.Trainer
  model:
    type: 'ModelForecast'
    embed_dim: 128
    future_steps: 12
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: False
    drop_path: 0.2
    num_actor_types: 1
    num_modes: 20
    dt: 0.4
    obs_len: 8
    # 历史摘要读取：last 保持 M0/C3；last_valid 启用 C1-A。
    readout_mode: 'last'
    # 证据状态：none 保持 M0/C1-A；observed_write_gap 启用 C3；integrated 启用 C4 集成机制。
    evidence_state_mode: 'none'
    evidence_conditioning: false
    # 主链裁定（2026-09-12）：编码器固定原版单向，与 trajimpute 主配置同步；无须区分单双向。
    bimamba: ${bimamba}
  pretrained_weights: ${pretrained_weights}
  lr: ${lr}
  weight_decay: ${weight_decay}
  epochs: ${epochs}
  warmup_epochs: ${warmup_epochs}
